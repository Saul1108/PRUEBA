    <style>
        /* 1. Reset Global */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #efebf4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.4s ease;
        }

        /* 2. Header */
        /* --- HEADER --- */
        .main-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
        }

        .header-logo .brand {
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .header-logo .separator {
            font-size: 2.5em;
            font-weight: 300;
            margin: 0 15px;
        }

        .header-logo .tagline {
            font-size: 0.9em;
            line-height: 1.2;
        }

        .header-nav {
            display: flex;
            gap: 40px;
        }

        .header-nav a {
            text-decoration: none;
            color: #333;
            font-size: 0.95em;
            position: relative;
            padding: 10px 0;
            text-align: center;
        }

        .header-nav a::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #34a8f3;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .header-nav a:hover::after {
            transform: scaleX(1);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .container {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 0 40px 60px;
        }

        /* --- BREADCRUMBS --- */
        .breadcrumb-container {
            width: 100%;
            align-self: stretch;
            margin-top: 30px;
            margin-bottom: 12px;
        }

        .breadcrumbs-nav {
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            color: #666;
            display: flex;
            justify-content: flex-start;
            text-align: left;
        }

        .breadcrumbs-nav a {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
        }

        .breadcrumbs-nav a:hover {
            text-decoration: underline;
        }

        .breadcrumbs-nav span {
            margin: 0 8px;
            color: #999;
        }

        .breadcrumbs-nav b {
            color: #000000;
        }

        /* 4. Contenido Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0 40px 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-info {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #321b44;
        }

        .doc-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #321b44;
        }

        /* 5. Descargas */
        .download-area {
            display: flex;
            gap: 20px;
        }

        .download-link {
            text-decoration: none;
            color: #321b44;
            font-weight: 700;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .download-link:hover {
            color: #8e44ad;
        }

        /* 6. Imagen */
        .image-container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 20px;
            min-height: 450px;
            margin: 0 auto;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            display: block;
            border: 1px solid #eee;
        }

        /* 7. Footer */
        .site-footer {
            background-color: #000000;
            color: white;
            padding: 20px 60px;
        }

        .footer-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            /* sin subrayado */
            color: inherit;
            /* mantiene el color original */
            cursor: pointer;
            /* icono de mano al pasar el mouse */
        }

        .logo-link:hover {
            opacity: 0.85;
            /* ligero efecto visual */
        }


        /* 8. Botones de Navegación */


        /* --- BOTÓN ANTERIOR ALINEADO CON MIGAJS DE PAN --- */
        /* Navegación (Anterior / Siguiente) */

        .nav-buttons-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            /* Anterior a la izq, Siguiente a la der */
            align-items: center;
            margin: 16px 0 32px 0;
            padding: 0;
            /* el padding lateral lo pone .main-content */
        }




        .nav-btn {

            appearance: none;
            /* para Safari/iOS */
            background: none;
            border: none;
            outline: none;
            box-shadow: none;

            color: #000000;
            font-size: 1.1em;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            /* toque de área clickeable sin dibujar caja */
            cursor: pointer;
            transition: color 0.25s ease, opacity 0.25s ease;
        }


        .nav-btn i {
            font-size: 1.8em;
        }

        .nav-btn:hover {
            color: #8e44ad;
        }
    </style>
</head>

        const claves = Object.keys(biblioteca);
        const indexActual = claves.indexOf(temaId);

        const container = document.getElementById('image-viewer-container');
        const title = document.getElementById('titulo-doc');
        const linkModulo = document.getElementById('link-modulo');
        const bread = document.getElementById('bread-actual');
        const btnAnterior = document.getElementById('btn-anterior');
        const btnSiguiente = document.getElementById('btn-siguiente');

        if (biblioteca[temaId]) {
            const data = biblioteca[temaId];
            title.innerText = data.n;
            if (bread) bread.innerText = data.n;

            // Actualizar color de fondo según el módulo
            const mapaColores = {
                'admin': '#eeeaf1',
                'ut': '#ecf5f6',
                'ar': '#fbe6f2',
                'ct': '#f9f4f6',
                'rev': '#ebebeb',
                'con': '#d3dbef'
            };
            if (data.mod && mapaColores[data.mod]) {
                document.body.style.backgroundColor = mapaColores[data.mod];
            }

            // Limpiar contenedor
            container.innerHTML = '';

            // Convertir img a array si es un string para manejarlo uniformemente
            const imagenes = Array.isArray(data.img) ? data.img : [data.img];

            // Función auxiliar para resolver la ruta de la imagen
            const resolverRuta = (nombre) => {
                // Si el nombre ya incluye una carpeta (tiene /), lo usamos tal cual
                return nombre.includes('/') ? nombre : "img/" + nombre;
            };

            const primeraImagen = resolverRuta(imagenes[0]);

            // Cargar todas las imágenes
            imagenes.forEach(nombreImg => {
                const imgElement = document.createElement('img');
                imgElement.src = resolverRuta(nombreImg);
                imgElement.alt = data.n;
                container.appendChild(imgElement);
            });

            // Lógica Botón Anterior
            btnAnterior.onclick = () => {
                if (indexActual <= 0) {
                    window.location.href = 'PruebaINFOMEX.html';
                } else {
                    window.location.href = `?tema=${claves[indexActual - 1]}`;
                }
            };

            // Lógica Botón Siguiente
            btnSiguiente.onclick = () => {
                if (indexActual < claves.length - 1) {
                    window.location.href = `?tema=${claves[indexActual + 1]}`;
                } else {
                    alert("Has llegado al final de la guía.");
                }
            };

            // Ocultar Siguiente si es el último tema
            if (indexActual === claves.length - 1) {
                btnSiguiente.style.visibility = 'hidden';
            }

            // --- DESCARGA GUÍA COMPLETA (PDF según módulo) ---
            const mapaPDF = {
                'admin': 'Infomex_Admin.pdf',
                'ut': 'Infomex_UTGestion.pdf',
                'ar': '3-Areas_Responsables.pdf',
                'ct': 'Infomex_CT.pdf',
                'rev': 'Infomex_Revisor.pdf',
                'con': 'INE_Consulta.pdf'
            };
            const linkGuiaCompleta = document.getElementById('link-guia-completa');
            if (data.mod && mapaPDF[data.mod]) {
                linkGuiaCompleta.href = mapaPDF[data.mod];
                linkGuiaCompleta.setAttribute('download', mapaPDF[data.mod]);
            }

            // --- DESCARGA GUÍA DEL MÓDULO (imagen única o ZIP) ---
            const nombreBase = `Guia_${data.n.replace(/[\s/\\:*?"<>|]/g, '_')}`;

            if (imagenes.length === 1) {
                // --- Imagen única: descarga directa ---
                fetch(primeraImagen)
                    .then(r => r.ok ? r.blob() : Promise.reject())
                    .then(blob => {
                        const urlBlob = window.URL.createObjectURL(blob);
                        linkModulo.href = urlBlob;
                        const ext = imagenes[0].split('.').pop();
                        linkModulo.setAttribute('download', `${nombreBase}.${ext}`);
                    })
                    .catch(() => {
                        linkModulo.href = primeraImagen;
                        linkModulo.setAttribute('download', imagenes[0].split('/').pop());
                    });
            } else {
                // --- Múltiples imágenes: empaquetar como ZIP ---
                linkModulo.removeAttribute('href');
                linkModulo.removeAttribute('download');
                linkModulo.style.cursor = 'pointer';

                linkModulo.addEventListener('click', async function (e) {
                    e.preventDefault();
                    // Indicador visual de progreso
                    const textoOriginal = linkModulo.innerHTML;
                    linkModulo.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparando ZIP...';
                    linkModulo.style.pointerEvents = 'none';

                    try {
                        const zip = new JSZip();
                        const carpeta = zip.folder(nombreBase);

                        await Promise.all(imagenes.filter(Boolean).map(async (nombreImg) => {
                            try {
                                const r = await fetch(resolverRuta(nombreImg));
                                if (r.ok) {
                                    const blob = await r.blob();
                                    carpeta.file(nombreImg.split('/').pop(), blob);
                                }
                            } catch (_) { /* imagen no disponible, se omite */ }
                        }));

                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        const url = window.URL.createObjectURL(zipBlob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${nombreBase}.zip`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    } catch (err) {
                        alert('Error al generar el ZIP. Verifica tu conexión e inténtalo de nuevo.');
                    } finally {
                        linkModulo.innerHTML = textoOriginal;
                        linkModulo.style.pointerEvents = '';
                    }
                });
            }

        } else {
            // Manejo de error si el tema no existe
            title.innerText = "Error";
            if (bread) bread.innerText = "No encontrado";
            container.innerHTML = '<p style="padding: 20px;">No se encontró la información.</p>';
            if (linkModulo) linkModulo.style.display = "none";
            if (btnAnterior) btnAnterior.style.display = "none";
            if (btnSiguiente) btnSiguiente.style.display = "none";
        }
    </script>
