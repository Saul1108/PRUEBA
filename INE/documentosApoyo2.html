<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos de Apoyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* 1. Reset Global */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #efebf4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        .main-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
        }

        .header-logo .brand {
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .header-logo .separator {
            font-size: 2.5em;
            font-weight: 300;
            margin: 0 15px;
        }

        .header-logo .tagline {
            font-size: 0.9em;
            line-height: 1.2;
        }

        .header-nav {
            display: flex;
            gap: 40px;
        }

        .header-nav a {
            text-decoration: none;
            color: #333;
            font-size: 0.95em;
            position: relative;
            padding: 10px 0;
            text-align: center;
        }

        .header-nav a::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #34a8f3;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .header-nav a:hover::after {
            transform: scaleX(1);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .container {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 60px;
        }

        /* --- BREADCRUMBS --- */
        .breadcrumb-container {
            width: 100%;
            align-self: stretch;
            margin-top: 30px;
            margin-bottom: 12px;
        }

        .breadcrumbs-nav {
            font-family: 'Roboto', sans-serif;
            font-size: 15px;
            color: #666;
            display: flex;
            justify-content: flex-start;
            text-align: left;
        }

        .breadcrumbs-nav a {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
        }

        .breadcrumbs-nav a:hover {
            text-decoration: underline;
        }

        .breadcrumbs-nav span {
            margin: 0 8px;
            color: #999;
        }

        .breadcrumbs-nav b {
            color: #000000;
        }

        /* 4. Contenido Principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 90px 90px;
        }

        .header-info {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #321b44;
        }

        .doc-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #321b44;
        }

        /* 5. Descargas */
        .download-area {
            display: flex;
            gap: 20px;
        }

        .download-link {
            text-decoration: none;
            color: #321b44;
            font-weight: 700;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .download-link:hover {
            color: #34a8f3;
        }




        /* 6. Imagen */
        .image-container {
            width: 100%;
            max-width: 1100px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;

            /* ESTO ES LO IMPORTANTE PARA VERTICALIDAD */
            display: flex;
            flex-direction: column;
            /* Alinea los hijos de arriba hacia abajo */
            align-items: center;
            /* Centra las imágenes horizontalmente */
            gap: 30px;
            /* Espacio de 30px entre cada imagen */
        }

        .image-container img {
            max-width: 100%;
            /* Evita que la imagen se salga del cuadro */
            height: auto;
            /* Mantiene la proporción */
            border: 1px solid #eee;
            /* Opcional: un borde sutil para cada foto */
        }

        /* 7. Footer */
        .site-footer {
            background-color: #000000;
            color: white;
            padding: 20px 60px;
            width: 100%
        }

        .footer-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }


        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            /* sin subrayado */
            color: inherit;
            /* mantiene el color original */
            cursor: pointer;
            /* icono de mano al pasar el mouse */
        }

        .logo-link:hover {
            opacity: 0.85;
            /* ligero efecto visual */
        }




        /* --- BOTÓN ANTERIOR ALINEADO CON MIGAJS DE PAN --- */
        .nav-buttons-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            /* Anterior a la izq, Siguiente a la der */
            align-items: center;
            margin: 16px 0 32px 0;
            padding: 0;
            /* el padding lateral lo pone .main-content */
        }

        .nav-btn {
            text-decoration: none;
            color: #321b44;
            font-size: 1.1em;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .nav-btn i {
            font-size: 1.8em;
        }

        .nav-btn:hover {
            color: #34a8f3;
        }
    </style>
</head>

<body>


    <header class="main-header">

        <div class="header-logo">
            <a href="index.html" class="logo-link">
                <span class="brand">INFOMEX</span>
                <span class="separator">|</span>
                <span class="tagline">Sistema de acceso<br>a la información</span>
            </a>
        </div>


        <nav class="header-nav">
            <a href="PruebaINFOMEX.html">Guías del sistema</a>
            <a href="tutorial.html">Tutorial para<br>versiones públicas</a>
            <a href="glosario.html">Glosario</a>
        </nav>
    </header>

    <main class="main-content">

        <div class="breadcrumb-container">
            <nav class="breadcrumbs-nav">
                <a href="index.html">Inicio</a> <span>/</span>
                <a href="documentosApoyo.html">Documentos de Apoyo</a> <span>/</span>
                <b id="bread-actual">Cargando...</b>
            </nav>
        </div>



        <div class="header-info">
            <h2 class="doc-title" id="titulo-doc">Guía visual: Cargando...</h2>

            <div class="download-area">
                <a href="Infomex_Admin.pdf" class="download-link" download>
                    Descargar archivo <i class="fas fa-file-download"></i>
                </a>
                <a href="Infomex_Admin.pdf" class="download-link" download>
                    Descargar Fichas Técnicas <i class="fas fa-book"></i>
                </a>
            </div>
        </div>


        <div class="nav-buttons-container" style="justify-content: space-between;">
            <a href="documentosApoyo.html" class="nav-btn" id="btn-anterior">
                <i class="far fa-arrow-alt-circle-left"></i> Anterior
            </a>
            <a href="#" class="nav-btn" id="btn-siguiente">
                Siguiente <i class="far fa-arrow-alt-circle-right"></i>
            </a>
        </div>


        <div class="image-container" id="contenedor-imagenes">
            <img id="img-viewer" src="placeholder.jpg" alt="Instrucciones">
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="INE.png" alt="Logo" style="height:25px;">
            <span>© INE México 2026</span>
        </div>
    </footer>


    <script>
        const params = new URLSearchParams(window.location.search);
        const temaId = params.get('tema');

        const biblioteca = {
            '1': { n: 'Información Pública', img: ['1-UT-FT-AI-0001-2020-InformacionPublica1-01.png', '1-UT-FT-AI-0001-2020-InformacionPublica1-02.png'] },
            '2': { n: 'Incompetencia', img: ['2-UT-FT-AI-0002-2020-Incompetencia.png'] },

            '3': { n: 'Confidencialidad', img: ['3-UT-FT-AI-0003-2020-ConfidencialidadV2-01.png', '3-UT-FT-AI-0003-2020-ConfidencialidadV2-02.png', '3-UT-FT-AI-0003-2020-ConfidencialidadV2-03.png'] },
            '4': { n: 'Confidencialidad - Anexo 1', img: ['4-UT-FT-AI-0003-2020-A1-01.png','4-UT-FT-AI-0003-2020-A1-02.png', '4-UT-FT-AI-0003-2020-A1-03.png', '4-UT-FT-AI-0003-2020-A1-04.png'] },
            '5': { n: 'Confidencialidad- Anexo 2', img: ['5-UT-FT-AI-0003-2020-A2-01.png', '5-UT-FT-AI-0003-2020-A2-02.png'] },
            
            '6': { n: 'Reserva', img: ['6-UT-FT-AI-0004-2020-ReservaV2-01.png', '6-UT-FT-AI-0004-2020-ReservaV2-02.png', '6-UT-FT-AI-0004-2020-ReservaV2-03.png'] },
            '7': { n: 'Reserva - Anexo único', img: ['7-UT-FT-AI-0004-2020-AU-01.png', '7-UT-FT-AI-0004-2020-AU-02.png'] },
            '8': { n: 'Declaración de inexistencia', img: ['8-UT-FT-AI-0005-2020-InexistenciaV2-01.png', '8-UT-FT-AI-0005-2020-InexistenciaV2-02.png', '8-UT-FT-AI-0005-2020-InexistenciaV2-03.png'] },
            '9': { n: 'Sugerencia Turno', img: ['9-UT-FT-AI-0006-2020-SugerenciaTurno-01.png', '9-UT-FT-AI-0006-2020-SugerenciaTurno-02.png'] },
            '10': { n: 'Sugerencia Turno - Anexo único', img: ['10-UT-FT-AI-0006-2020-AU.png'] },

            '11': { n: 'Información Pública', img: ['11-Informacion_Publica-01.png', '11-Informacion_Publica-02.png', '11-Informacion_Publica-03.png',
                                 '11-Informacion_Publica-04.png', '11-Informacion_Publica-05.png', '11-Informacion_Publica-06.png', 
                                 '11-Informacion_Publica-07.png', '11-Informacion_Publica-08.png', '11-Informacion_Publica-09.png', 
                                 '11-Informacion_Publica-10.png', '11-Informacion_Publica-11.png', '11-Informacion_Publica-12.png', 
                                 '11-Informacion_Publica-13.png', '11-Informacion_Publica-14.png'] },
            '12': { n: 'Incompetencia', img: ['12-Incompetencia-01.png', '12-Incompetencia-02.png', '12-Incompetencia-03.png',
                                              '12-Incompetencia-04.png', '12-Incompetencia-05.png', '12-Incompetencia-06.png',
                                              '12-Incompetencia-07.png'] },
            '13': { n: 'Inexistencia', img: ['13-Inexistencia-01.png', '13-Inexistencia-02.png', '13-Inexistencia-03.png',
                                             '13-Inexistencia-04.png', '13-Inexistencia-05.png', '13-Inexistencia-06.png',
                                             '13-Inexistencia-07.png', '13-Inexistencia-08.png', '13-Inexistencia-09.png',
                                             '13-Inexistencia-10.png'] },
            '14': { n: 'Confidencialidad', img: ['14-Confidencialidad-01.png', '14-Confidencialidad-02.png', '14-Confidencialidad-03.png',
                                                '14-Confidencialidad-04.png', '14-Confidencialidad-05.png', '14-Confidencialidad-06.png',
                                                '14-Confidencialidad-07.png', '14-Confidencialidad-08.png', '14-Confidencialidad-09.png',
                                                '14-Confidencialidad-10.png', '14-Confidencialidad-11.png', '14-Confidencialidad-12.png',
                                                '14-Confidencialidad-13.png', '14-Confidencialidad-14.png'] },
            '15': { n: 'Reserva', img: ['15-Reserva-01.png', '15-Reserva-02.png', '15-Reserva-03.png',
                                        '15-Reserva-04.png', '15-Reserva-05.png', '15-Reserva-06.png',
                                        '15-Reserva-07.png', '15-Reserva-08.png', '15-Reserva-09.png',
                                        '15-Reserva-10.png', '15-Reserva-11.png'] },

            '16': { n: 'Plazos internos', img: ['1-Ficha_UT-FT-PDP-002-2020-PlazosInternos1.png'] },
            '17': { n: 'Esquema básico de respuestas', img: ['2-Ficha_UT-FT-PDP-001-2020-EsquemaBasicoRespuesta1-01.png', '2-Ficha_UT-FT-PDP-001-2020-EsquemaBasicoRespuesta1-02.png'] },
 

        };

        const container = document.getElementById('contenedor-imagenes');
        const title = document.getElementById('titulo-doc');
        const bread = document.getElementById('bread-actual');
        const btnAnterior = document.getElementById('btn-anterior');
        const btnSiguiente = document.getElementById('btn-siguiente');

        // Obtener las llaves de la biblioteca para saber el orden
        const temasKeys = Object.keys(biblioteca);
        const indexActual = temasKeys.indexOf(temaId);

        if (indexActual !== -1) {
            const data = biblioteca[temaId];
            bread.innerText = data.n;
            title.innerText = data.n;

            container.innerHTML = '';

            // Cargar imágenes
            data.img.forEach(nombreArchivo => {
                const nuevaImg = document.createElement('img');
                nuevaImg.src = "documentosApoyo/" + nombreArchivo;
                nuevaImg.alt = data.n;
                container.appendChild(nuevaImg);
            });

            // --- LÓGICA DE BOTONES ---

            // 1. Botón Anterior
            if (indexActual === 0) {
                // Si es el primer tema ('info'), regresa a Bienvenida
                btnAnterior.href = "index.html";
            } else {
                // Si no es el primero, regresa al tema anterior de la lista
                const temaAnterior = temasKeys[indexActual - 1];
                btnAnterior.href = `?tema=${temaAnterior}`;
            }

            // 2. Botón Siguiente
            if (indexActual < temasKeys.length - 1) {
                // Si hay un tema después, apunta a él
                const temaSiguiente = temasKeys[indexActual + 1];
                btnSiguiente.href = `?tema=${temaSiguiente}`;
            } else {
                // Si es el último, podemos ocultar el botón siguiente o mandarlo a otro lado
                btnSiguiente.style.display = 'none';
            }

        } else {
            title.innerText = "Error";
            bread.innerText = "No encontrado";
            container.innerHTML = "<p>No se encontró el contenido solicitado.</p>";
            btnSiguiente.style.display = 'none';
        }
    </script>



</body>

</html>
